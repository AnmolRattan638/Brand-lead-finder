# Add or remove sources here. Only PUBLIC pages and search queries.
# No login, captcha-solving or stealth is used. If a site blocks us, it is skipped.

freshness_days: 14        # ignore results older than this
results_per_query: 10

# ---------- 1. SEARCH (needs TAVILY_API_KEY, EXA_API_KEY or BRAVE_API_KEY) ----------
# Explicit intent: people asking for a designer right now.
searches:
  - name: linkedin-asks
    query: '"looking for" OR "need" OR "hiring" brand designer OR "brand identity" OR "logo designer" OR packaging designer'
    domains: [linkedin.com]

  - name: reddit-asks
    query: 'need brand identity OR logo designer OR packaging designer for my startup OR brand'
    domains: [reddit.com]

  - name: x-asks
    query: 'looking for a brand designer OR "brand identity" OR "logo designer" startup'
    domains: [x.com, twitter.com]

  - name: wellfound-jobs
    query: 'brand designer OR "brand identity" freelance OR contract'
    domains: [wellfound.com]

  - name: indie-hackers-asks
    query: 'looking for brand designer OR logo designer'
    domains: [indiehackers.com]

  - name: web-asks
    query: '"looking for a brand designer" OR "need a brand identity" OR "hiring a brand identity designer" India'

# Trigger events: they will need branding soon.
  - name: d2c-launches
    query: 'D2C brand launch India new brand launching packaging'

  - name: funding-consumer
    query: 'raises pre-seed OR seed funding D2C OR skincare OR food OR beverage OR wellness brand India'

  - name: rebrands
    query: 'announces rebrand OR "new brand identity" OR "brand refresh" startup India'

# ---------- 2. PAGES (watched directly) ----------
# mode: classify -> each link goes to the Groq scorer
# mode: trigger  -> each entry gets base_score, no LLM cost
# Only NEW entries become leads. The first run records a baseline (so you are not flooded with
# companies that are already established), except where emit_initial: true.
# Options: page_template + pages (pagination), link_regex, external_only, require_keywords, render.

pages:
  # --- Consumer-brand VCs: startups that just got funding and sell physical products ---
  - name: sauce-vc-portfolio          # consumer brands, links go straight to each brand's website
    url: https://sauce.vc/portfolio
    mode: trigger
    external_only: true
    emit_initial: true
    base_score: 50
    signal: consumer VC portfolio (Sauce.vc)

  - name: fireside-ventures           # consumer-only portfolio, via VCBacked directory
    url: https://www.vcbacked.co/directory/investors/fireside-ventures
    page_template: "{url}/page/{n}"
    pages: 3
    link_regex: "/company/"
    mode: trigger
    emit_initial: true
    base_score: 50
    signal: consumer VC portfolio (Fireside)

  # --- Broader investors: only entries that look like consumer/physical brands are kept ---
  - name: venture-catalysts
    url: https://www.vcbacked.co/directory/investors/venture-catalysts
    page_template: "{url}/page/{n}"
    pages: 10
    link_regex: "/company/"
    mode: trigger
    base_score: 45
    signal: accelerator portfolio (Venture Catalysts)
    require_keywords: &consumer_kw [d2c, consumer, brand, food, beverage, snack, beauty, skincare, cosmetic, personal care, wellness, apparel, fashion, lifestyle, jewellery, jewelry, home, pet, baby, kids, organic, packaged, coffee, tea]

  - name: blume-ventures
    url: https://www.vcbacked.co/directory/investors/blume-ventures
    page_template: "{url}/page/{n}"
    pages: 7
    link_regex: "/company/"
    mode: trigger
    base_score: 45
    signal: seed portfolio (Blume)
    require_keywords: *consumer_kw

  - name: peak-xv
    url: https://www.vcbacked.co/directory/investors/peak-xv-partners
    page_template: "{url}/page/{n}"
    pages: 17
    link_regex: "/company/"
    mode: trigger
    base_score: 45
    signal: portfolio (Peak XV)
    require_keywords: *consumer_kw

  - name: kalaari
    url: https://www.vcbacked.co/directory/investors/kalaari-capital
    page_template: "{url}/page/{n}"
    pages: 3
    link_regex: "/company/"
    mode: trigger
    base_score: 45
    signal: portfolio (Kalaari)
    require_keywords: *consumer_kw

  # --- Pre-launch / new-launch feed ---
  - name: betalist-new
    url: https://betalist.com/
    page_template: "{url}/?page={n}"
    pages: 3
    link_regex: "/startups/"
    mode: trigger
    base_score: 45
    signal: new startup launch (BetaList)
    require_keywords: *consumer_kw

  # --- Off by default ---
  - name: antler-portfolio            # global, partly JavaScript-rendered, mostly B2B/AI
    url: https://antler.co/portfolio
    mode: trigger
    external_only: true
    base_score: 45
    signal: accelerator portfolio (Antler)
    require_keywords: *consumer_kw
    enabled: false

  # Behance's terms restrict scraping, so this stays OFF unless you decide otherwise.
  - name: behance-jobs
    url: https://www.behance.net/joblist
    mode: classify
    render: true
    enabled: false

  # Add your own: accelerator / incubator cohort pages that load without login.
  # - name: my-cohort-page
  #   url: https://example.com/portfolio
  #   mode: trigger
  #   base_score: 50
  #   signal: accelerator cohort
